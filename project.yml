name: Cleaner
options:
  bundleIdPrefix: com.ygw
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
packages:
  CleanerCore:
    path: .
targets:
  Cleaner:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: CleanerCore
        product: CleanerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ixxxxoooo
        PRODUCT_NAME: Cleaner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 开发者清理
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "@author ygw"
        # 关闭沙盒：沙盒无法读取用户主目录下的各类隐藏目录
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # 固定 Bundle ID（ixxxxoooo）。签名时的指定要求（designated requirement）由 restart.sh 重新签名固定为
        # identifier "ixxxxoooo"，这样每次重新编译后 TCC（完全磁盘访问）授权不会失效
        CODE_SIGN_ENTITLEMENTS: Cleaner.entitlements
        INFOPLIST_KEY_NSAppleEventsUsageDescription: 需要通过 Finder 清空废纸篓，以真正释放已清理项目占用的磁盘空间。
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: 需要扫描桌面上的项目目录以查找可清理的构建产物。
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: 需要扫描文稿中的项目目录以查找可清理的构建产物。
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: 需要扫描下载目录中的项目以查找可清理的构建产物。
        OTHER_CODE_SIGN_FLAGS: "--requirements '=designated => identifier \"ixxxxoooo\"'"
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  Cleaner:
    build:
      targets:
        Cleaner: all
    run:
      config: Debug
